name: Release

# 发版入口：
#   1. 自动（主路径）：CI 在 main 上全绿后，由 ci.yml 的 publish job 调用本 workflow
#      （workflow_call），自动打 tag v<日期>-<7位哈希> 并发 Release。
#      commit message 里带 [skip release] 就不发（改文档、无关提交时用）。
#   2. 手动打 tag：git tag v20261120-abc1234 && git push origin v20261120-abc1234
#   3. 手动触发：Actions → Release → Run workflow，填 tag 名（tag 不存在会创建）
#
# 不再用 workflow_run 触发：workflow 文件刚上线时它会对历史 CI 完成事件补触发，
# 结果同一个提交被发了两遍（第二个卡在 github release 步骤）。
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      auto:
        description: "自动发版：版本号取 v<日期>-<7位哈希>，并由 [skip release] / 已存在 tag 决定是否跳过"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "手动发布用的版本号（如 v20261120-abc1234）"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      go: ${{ steps.v.outputs.go }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_call（CI 里调）与 tag push 都用当前提交；只有手动 dispatch 也一样。
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: v
        run: |
          set -eu
          go=true
          sha="$(git rev-parse HEAD)"
          # workflow_call 时 github.event_name 仍是调用者的事件（push），
          # 所以自动发版靠 inputs.auto 区分，不能看 event_name。
          if [ "${{ inputs.auto }}" = "true" ]; then
            msg="$(git log -1 --format=%s)"
            echo "commit: $msg"
            if printf '%s' "$msg" | grep -qF '[skip release]'; then
              echo "commit 带 [skip release]，跳过发版"; go=false
            fi
            tag="v$(date +%Y%m%d)-$(echo "$sha" | cut -c1-7)"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "tag $tag 已存在（这次提交发过了），跳过"; go=false
            fi
          else
            case "${{ github.event_name }}" in
              push)
                tag="${{ github.ref_name }}"
                ;;
              workflow_dispatch)
                tag="${{ inputs.tag || github.event.inputs.tag }}"
                ;;
              *)
                echo "未知触发方式 ${{ github.event_name }}，跳过"; go=false ;;
            esac
          fi
          # 内嵌版本号 = tag 名；tag 本身已经是 v<日期>-<哈希>。
          version="$tag"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "go=$go"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag sha=$sha go=$go"

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [meta]
    if: needs.meta.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          out=codearts2api
          [ "$GOOS" = "windows" ] && out=codearts2api.exe
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILT}" \
            -o "dist/$out" .
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -q "codearts2api_${GOOS}_${GOARCH}.zip" "$out"
          else
            tar czf "codearts2api_${GOOS}_${GOARCH}.tar.gz" "$out"
          fi
          rm -f "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: codearts2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: [meta, build]
    if: needs.meta.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: codearts2api-*

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # tag 不存在时由 action 创建，指向这次发布的提交（自动发版就是这条路）。
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: ${{ needs.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 摘要
        run: |
          {
            echo "### 已发布 ${{ needs.meta.outputs.tag }}"
            echo ""
            echo "- 提交：\`${{ needs.meta.outputs.sha }}\`"
            echo "- 产物：5 个平台（linux/darwin amd64+arm64、windows amd64）+ SHA256SUMS"
            echo "- 镜像：\`ghcr.io/${{ github.repository }}:latest\` 与 \`:sha-$(echo ${{ needs.meta.outputs.sha }} | cut -c1-7)\`（由 Docker 流水线在 main 上构建）"
          } >> "$GITHUB_STEP_SUMMARY"
