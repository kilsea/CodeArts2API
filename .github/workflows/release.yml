name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手动发布用的版本号（如 v0.1.1）"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          # 版本号 = v + 构建日期 + 提交哈希（与 make build 同一规则）。
          # 发布用的 tag 只体现在 artifact 文件名与 release 标题里，
          # 不再当作二进制内嵌版本 —— 否则同一个 tag 重建两次无法区分。
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="v$(date +%Y%m%d)-${COMMIT}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          out=codearts2api
          [ "$GOOS" = "windows" ] && out=codearts2api.exe
          go build -trimpath             -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILT}"             -o "dist/$out" .
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -q "codearts2api_${GOOS}_${GOARCH}.zip" "$out"
          else
            tar czf "codearts2api_${GOOS}_${GOARCH}.tar.gz" "$out"
          fi
          rm -f "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: codearts2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: codearts2api-*

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true