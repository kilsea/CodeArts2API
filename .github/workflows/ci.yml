name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR 上取消旧的是省资源；main 上不能取消 —— 发版跑在同一个 workflow 里，
# 取消一次就意味着这次提交没有 Release。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # 本项目零第三方依赖（ADR 0001），因此没有 go.sum。
          # setup-go 默认拿 go.sum 算缓存 key，找不到就整段缓存失效并告警；
          # 指向 go.mod 后缓存仍能命中（主要收益是 GOCACHE 里的标准库编译产物）。
          cache: true
          cache-dependency-path: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化："; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: 控制台 JS/CSS 检查
        run: python tools/check_html_js.py

      - name: 构建
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/codearts2api .

  build-windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      # Windows 专属代码（DPAPI / 定长回写）只在 build tag 为 windows 时编译，
      # 因此必须单独跑一遍，避免 linux 任务漏掉编译错误。
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  # main 上全绿后自动发版。直接在本 workflow 里调用 reusable workflow，
  # 不走 workflow_run —— 后者会在 workflow 文件刚上线时对历史 CI 事件补触发，
  # 实测把同一个提交发了两遍（第二个在 github release 步骤撞车失败）。
  publish:
    name: publish release
    needs: [test, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      auto: true
