---
services:
  codearts2api:
    # 镜像来自 GitHub Actions（.github/workflows/docker.yml）：linux/amd64 + linux/arm64。
    #   :latest 最新 main 构建   :main 同 latest   :sha-<7位> 某次提交   :v<日期-哈希> tag
    # 私有包先登录：echo $CR_PAT | docker login ghcr.io -u <你的 GitHub 用户名> --password-stdin
    # 本地改代码想直接构建：注释掉 image，改用  build: { context: . }  或 `make docker`
    image: ${CODEARTS_IMAGE:-ghcr.io/kilsea/codearts2api:latest}
    container_name: codearts2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:10087:10087"
    volumes:
      - ./data:/data
    environment:
      # 管理密码：容器内网关看到的来源是 docker 网桥地址（不是环回），
      # 因此通过端口映射使用控制台时**必须设置密码**，否则管理接口会返回 403。
      CODEARTS_ADMIN_PASSWORD: ${CODEARTS_ADMIN_PASSWORD:-}
      # 未签发密钥时是否允许非本机匿名调用 /v1/*（默认 false，仅本机直连）。
      # 容器里“本机”是网桥地址，所以想让宿主机客户端免密钥调用才需打开它。
      CODEARTS_ALLOW_ANONYMOUS: ${CODEARTS_ALLOW_ANONYMOUS:-}
      TZ: Asia/Shanghai
    command:
      - -host
      - 0.0.0.0
      - -port
      - "10087"
      - -data
      - /data/codearts2api-data.json
      # 容器里没有 DPAPI，无法自动读取桌面端凭据；
      # 请在控制台用「手工录入」或「从 session JSON 导入」提供凭据。
      - -no-import

  # 可选的联网搜索后端（默认不启动）：
  #   docker compose --profile search up -d
  # 启动后网关端「设置 → 联网搜索 → 端点」填 http://searxng:8080。
  # 首次启动会生成 ./searxng/settings.yml，必须确认：
  #   search.formats 包含 json，server.limiter 为 false（见 docs/WEBSEARCH.md）。
  searxng:
    image: searxng/searxng:latest
    container_name: codearts2api-searxng
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - TZ=Asia/Shanghai
    volumes:
      - ./searxng:/etc/searxng
